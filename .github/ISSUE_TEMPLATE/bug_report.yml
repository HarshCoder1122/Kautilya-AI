name: 🐛 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please **don't** report security issues here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots or a screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the chat in Pro mode
        2. Ask "…"
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Chat, Canvas, Kautilya Computer, Deep Research, Voice / telephony, Agent Studio, Integrations / MCP, Developer API, Dashboard, Deployment, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console or backend logs. Remove any keys or tokens before pasting.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Commit abc123 · self-hosted on HF Spaces · Chrome 130 · macOS"
