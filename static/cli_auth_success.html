<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAUTILYA AI | CLI Authenticated</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --bg-black: #020202;
            --accent-primary: #6366f1; /* Indigo */
            --accent-secondary: #f43f5e; /* Rose */
            --accent-tertiary: #a855f7; /* Purple */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --gradient-3d: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* 3D Animated Background Background */
        .orb-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.5;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: var(--gradient-3d);
            opacity: 0.6;
            animation: move-orb 20s infinite alternate;
        }

        .orb-1 { width: 500px; height: 500px; top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; bottom: -100px; right: -100px; animation-delay: -5s; }

        @keyframes move-orb {
            0% { transform: translate(0, 0) scale(1.1); }
            100% { transform: translate(100px, 100px) scale(0.9); }
        }

        /* Main Card 3D */
        .card-3d {
            width: 90%;
            max-width: 460px;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 50px 40px;
            position: relative;
            transform-style: preserve-3d;
            animation: card-entry 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        @keyframes card-entry {
            0% { opacity: 0; transform: translateY(50px) rotateX(10deg) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        }

        /* 3D Success Icon */
        .icon-wrapper {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            position: relative;
            transform-style: preserve-3d;
        }

        .icon-shadow {
            position: absolute;
            inset: 10px;
            background: var(--gradient-3d);
            border-radius: 50%;
            filter: blur(25px);
            opacity: 0.4;
            animation: pulse-shadow 2s infinite ease-in-out;
        }

        .icon-main {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(20px);
            box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.1);
        }

        .icon-main i {
            font-size: 64px;
            background: var(--gradient-3d);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: icon-float 3s infinite ease-in-out;
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes pulse-shadow {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        /* Typography */
        h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 17px;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Dash Section - Stats */
        .stats-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateZ(10px);
            transition: 0.3s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-text {
            text-align: left;
        }

        .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
        .stat-value { font-size: 14px; font-weight: 600; color: #fff; font-family: 'Inter', sans-serif; }

        /* Premium Button */
        .btn-modern {
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            background: #fff;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 0 #cbd5e1;
            margin-bottom: 20px;
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #cbd5e1;
            filter: brightness(1.1);
        }

        .btn-modern:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #cbd5e1;
        }

        .btn-modern i { font-size: 20px; }

        .hint {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 500;
            opacity: 0.6;
        }

        /* 3D Hover Effect Script Support */
        .interactive-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-primary);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }

        @media (max-width: 480px) {
            .card-3d { padding: 40px 25px; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="card-3d" id="mainCard">
        <div class="interactive-glow" id="glow"></div>
        
        <div class="icon-wrapper">
            <div class="icon-shadow"></div>
            <div class="icon-main">
                <i class="material-icons-round">verified_user</i>
            </div>
        </div>

        <h1>Access Granted</h1>
        <p>Your identity has been verified. The J.A.R.V.I.S CLI engine is now synchronized with your workspace.</p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="material-icons-round" style="font-size: 18px;">terminal</i></div>
                <div class="stat-text">
                    <div class="stat-label">Session Target</div>
                    <div class="stat-value" id="sess-display">Native CLI Engine</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="material-icons-round" style="font-size: 18px;">security</i></div>
                <div class="stat-text">
                    <div class="stat-label">Protection Level</div>
                    <div class="stat-value">End-to-End Encrypted</div>
                </div>
            </div>
        </div>

        <button class="btn-modern" onclick="window.close()">
            <span>RETURN TO TERMINAL</span>
            <i class="material-icons-round">arrow_forward</i>
        </button>

        <div class="hint">You can safely close this window</div>
    </div>

    <script>
        // 3D Tilt Effect
        const card = document.getElementById('mainCard');
        const glow = document.getElementById('glow');

        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const xc = rect.width / 2;
            const yc = rect.height / 2;
            
            const dx = x - xc;
            const dy = y - yc;
            
            card.style.transform = `rotateY(${dx / 20}deg) rotateX(${-dy / 20}deg)`;
            
            glow.style.opacity = '0.3';
            glow.style.left = `${x - 150}px`;
            glow.style.top = `${y - 150}px`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            glow.style.opacity = '0';
        });

        // URL Params
        const urlParams = new URLSearchParams(window.location.search);
        const sid = urlParams.get('session_id') || urlParams.get('key');
        if (sid) {
            document.getElementById('sess-display').textContent = 'ID: ' + sid.substring(0, 16) + '...';
        }
    </script>
</body>
</html>
